name: release

# Two triggers:
#
#  - Tag push (v<upstream-version>-rN, cut by scripts/tag-release.sh):
#    builds that upstream version and publishes an immutable GitHub
#    release for the tag. Tags are the release ledger — numbering happens
#    in the script (next free -rN read from origin's tags; git itself
#    rejects duplicate tags), and the tag pins the exact port commit
#    being released.
#
#  - workflow_dispatch: test build of any ref — uploads artifacts,
#    publishes nothing.
#
# Releases are never modified after publishing: every build has a unique
# kernel vermagic, so a release's bundled ImageBuilder must stay
# downloadable unchanged for as long as anyone runs that release's image.
# A rebuild of the same upstream version is always a new -rN tag.
on:
  push:
    tags: ["v*-r[0-9]*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "ImmortalWrt ref for a test build (no release)"
        default: "v25.12.1"

# Needed to create releases with the default GITHUB_TOKEN.
permissions:
  contents: write

# One build at a time - concurrent runs would fight over the caches.
concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Tag builds derive the upstream version from the tag name
      # (v25.12.1-r3 -> v25.12.1); test builds take the dispatch input.
      - name: Resolve build parameters
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "BUILD_REF=${GITHUB_REF_NAME%-r*}" >> "$GITHUB_ENV"
          else
            echo "BUILD_REF=${{ inputs.ref }}" >> "$GITHUB_ENV"
          fi

      # Disk headroom check only. GitHub's ubuntu runners have ~88 GB free
      # on a 145 GB disk (measured 2026-08); this build peaks around
      # 30-40 GB, so no cleanup of preinstalled software is needed. Should
      # a run ever fail with "No space left on device", the classic fix is
      # deleting /usr/share/dotnet /usr/local/lib/android
      # /opt/hostedtoolcache/CodeQL here (~18 GB) before building.
      - name: Report disk space
        run: df -h /

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget libelf-dev zstd

      - name: Checkout ImmortalWrt
        run: |
          git clone --depth=1 -b "$BUILD_REF" \
            https://github.com/immortalwrt/immortalwrt.git

      - name: Apply the port
        run: sh scripts/apply-r3-support.sh immortalwrt

      - name: Restrict image recipes to the R3
        run: sh scripts/trim-mt7620-to-r3.sh immortalwrt

      # ---- caches -------------------------------------------------------
      # dl/: checksum-verified tarballs; frozen per tag, so an exact-key hit
      # is complete and a miss saves once after `make download`.
      - name: Restore download cache
        id: cache-dl
        uses: actions/cache/restore@v6
        with:
          path: immortalwrt/dl
          key: dl-${{ env.BUILD_REF }}
          restore-keys: |
            dl-

      # Toolchain + host tools (~35-40 min cold). Keyed on the ref, the
      # toolchain-defining source trees, AND config.seed. The seed matters
      # because build options (e.g. CCACHE wrapping the compilers) enter
      # every package's configure fingerprint: restoring trees that were
      # built under a different config makes make re-run configure on
      # dirty state, which fails. Any of the three changing must miss
      # cleanly and rebuild from scratch. No cross-ref fallback on purpose.
      - name: Restore toolchain cache
        id: cache-toolchain
        uses: actions/cache/restore@v6
        with:
          path: |
            immortalwrt/staging_dir/host*
            immortalwrt/staging_dir/toolchain-*
            immortalwrt/build_dir/host*
            immortalwrt/build_dir/toolchain-*
          key: toolchain-${{ env.BUILD_REF }}-${{ hashFiles('immortalwrt/tools/**', 'immortalwrt/toolchain/**', 'config.seed') }}

      # Cached stamps must be newer than the freshly-cloned sources or make
      # re-does the work the cache was meant to skip.
      - name: Refresh cached toolchain timestamps
        if: steps.cache-toolchain.outputs.cache-hit == 'true'
        run: find immortalwrt/staging_dir immortalwrt/build_dir -type f -print0 | xargs -0 -r touch -c

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: immortalwrt/.ccache
          key: ccache-${{ env.BUILD_REF }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.BUILD_REF }}-

      # feeds.conf.default pins every feed to an exact commit, so the
      # checkout is deterministic; a hit turns `feeds update -a` (~90s of
      # clones) into a no-op walk.
      - name: Restore feeds cache
        id: cache-feeds
        uses: actions/cache/restore@v6
        with:
          path: immortalwrt/feeds
          key: feeds-${{ env.BUILD_REF }}-${{ hashFiles('immortalwrt/feeds.conf.default') }}
      # -------------------------------------------------------------------

      - name: Configure
        run: |
          cd immortalwrt
          mkdir -p .ccache
          printf 'max_size = 1.5G\n' > .ccache/ccache.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp ../config.seed .config
          make defconfig
          # defconfig silently drops symbols whose prompt is hidden (CCACHE
          # needs DEVEL) - fail loudly if a load-bearing one went missing
          grep -q "CONFIG_TARGET_ramips_mt7620_DEVICE_xiaomi_miwifi-r3=y" .config
          grep -q "^CONFIG_CCACHE=y" .config
          grep -q "^CONFIG_ALL_KMODS=y" .config
          grep -q "^CONFIG_IB=y" .config

      - name: Save feeds cache
        if: steps.cache-feeds.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: immortalwrt/feeds
          key: ${{ steps.cache-feeds.outputs.cache-primary-key }}

      - name: Build toolchain
        run: |
          cd immortalwrt
          make -j"$(nproc)" tools/install
          make -j"$(nproc)" toolchain/install

      - name: Save toolchain cache
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            immortalwrt/staging_dir/host*
            immortalwrt/staging_dir/toolchain-*
            immortalwrt/build_dir/host*
            immortalwrt/build_dir/toolchain-*
          key: ${{ steps.cache-toolchain.outputs.cache-primary-key }}

      - name: Download sources
        run: cd immortalwrt && make -j"$(nproc)" download

      - name: Save download cache
        if: steps.cache-dl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: immortalwrt/dl
          key: dl-${{ env.BUILD_REF }}

      # Deliberately no "|| make -j1 V=s world" retry: CONFIG_BUILD_LOG=y
      # already writes per-package logs (uploaded on failure below), and a
      # serial rerun would spend up to an hour reproducing the same failure.
      - name: Build
        run: cd immortalwrt && make -j"$(nproc)" world

      # Save even on a failed build so the retry is cheap.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: immortalwrt/.ccache
          key: ccache-${{ env.BUILD_REF }}-${{ github.run_id }}

      # CONFIG_BUILD_LOG=y writes per-package logs; without this a quiet
      # "-C toolchain/binutils ... failed to build" is undiagnosable.
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: immortalwrt/logs/
          if-no-files-found: ignore

      # Everything a release needs: all image formats + manifest,
      # sha256sums, and the ImageBuilder matching this exact build.
      - name: Collect release assets
        run: |
          mkdir -p out
          cp immortalwrt/bin/targets/ramips/mt7620/*miwifi-r3* out/
          cp immortalwrt/bin/targets/ramips/mt7620/sha256sums out/
          cp immortalwrt/bin/targets/ramips/mt7620/immortalwrt-imagebuilder-*.tar.* out/
          ls -la out/

      # Test builds (workflow_dispatch) get artifacts instead of a release.
      - name: Upload artifacts (test build)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: immortalwrt-xiaomi-miwifi-r3
          path: out/

      # gh is preinstalled on GitHub-hosted runners (not an extra
      # dependency) and is the least-fragile way to create a release with
      # assets; the raw REST equivalent is two endpoints plus MIME handling.
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kernel=$(awk '$1 == "kernel" { print $3 }' \
            immortalwrt/bin/targets/ramips/mt7620/*.manifest | head -n1)
          upstream=$(git -C immortalwrt rev-parse HEAD)

          {
            echo "ImmortalWrt \`$BUILD_REF\` (upstream commit \`$upstream\`) for the Xiaomi Mi Router 3,"
            echo "built from port commit \`$GITHUB_SHA\`."
            echo
            echo "Kernel package version: \`$kernel\`"
            echo
            echo "**Assets**: sysupgrade image (normal upgrade), initramfs (TFTP RAM-boot"
            echo "test/recovery), factory/breed/split recovery formats, \`sha256sums\`, and"
            echo "this build's ImageBuilder."
            echo
            echo "**Kernel modules are tied to this exact build** (vermagic): install"
            echo "kmods only from *this release's* ImageBuilder, never from another"
            echo "release or the official feeds. See the README for ImageBuilder usage."
          } > notes.md

          # If a previous publish attempt half-succeeded, this fails on the
          # already-existing release: inspect it, delete it if incomplete,
          # then re-run this workflow run (the tag itself stays valid).
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "ImmortalWrt $BUILD_REF for Mi Router 3 ($RELEASE_TAG)" \
            --notes-file notes.md \
            out/*
          echo "Published release $RELEASE_TAG"
