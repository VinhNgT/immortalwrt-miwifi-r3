name: build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      ref:
        description: "ImmortalWrt ref to build"
        default: "v25.12.1"

# The ref the device actually runs. Push builds use it too (master builds
# only happen via manual dispatch with ref=master).
env:
  BUILD_REF: ${{ github.event.inputs.ref || 'v25.12.1' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget libelf-dev zstd

      - name: Checkout ImmortalWrt
        run: |
          git clone --depth=1 -b "$BUILD_REF" \
            https://github.com/immortalwrt/immortalwrt.git

      - name: Apply the port
        run: sh scripts/apply-r3-support.sh immortalwrt

      - name: Restrict image recipes to the R3
        run: sh scripts/trim-mt7620-to-r3.sh immortalwrt

      # ---- caches -------------------------------------------------------
      # dl/: checksum-verified tarballs; frozen per tag, so an exact-key hit
      # is complete and a miss saves once after `make download`.
      - name: Restore download cache
        id: cache-dl
        uses: actions/cache/restore@v4
        with:
          path: immortalwrt/dl
          key: dl-${{ env.BUILD_REF }}
          restore-keys: |
            dl-

      # Toolchain + host tools (~35 min cold). Keyed on the ref plus a hash
      # of the toolchain-defining trees AND config.seed: build options like
      # CCACHE change every package's configure fingerprint, and replaying
      # that onto restored build trees re-runs configure on dirty state
      # (run 33359642180: binutils/gdb died that way). A seed change must
      # miss cleanly and rebuild. No cross-ref fallback on purpose.
      - name: Restore toolchain cache
        id: cache-toolchain
        uses: actions/cache/restore@v4
        with:
          path: |
            immortalwrt/staging_dir/host*
            immortalwrt/staging_dir/toolchain-*
            immortalwrt/build_dir/host*
            immortalwrt/build_dir/toolchain-*
          key: toolchain-${{ env.BUILD_REF }}-${{ hashFiles('immortalwrt/tools/**', 'immortalwrt/toolchain/**', 'config.seed') }}

      # Cached stamps must be newer than the freshly-cloned sources or make
      # re-does the work the cache was meant to skip.
      - name: Refresh cached toolchain timestamps
        if: steps.cache-toolchain.outputs.cache-hit == 'true'
        run: find immortalwrt/staging_dir immortalwrt/build_dir -type f -print0 | xargs -0 -r touch -c

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: immortalwrt/.ccache
          key: ccache-${{ env.BUILD_REF }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.BUILD_REF }}-
      # -------------------------------------------------------------------

      - name: Configure
        run: |
          cd immortalwrt
          mkdir -p .ccache
          printf 'max_size = 1.5G\n' > .ccache/ccache.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp ../config.seed .config
          make defconfig
          # defconfig silently drops symbols whose prompt is hidden (CCACHE
          # needs DEVEL) - fail loudly if a load-bearing one went missing
          grep -q "CONFIG_TARGET_ramips_mt7620_DEVICE_xiaomi_miwifi-r3=y" .config
          grep -q "^CONFIG_CCACHE=y" .config
          grep -q "^CONFIG_ALL_KMODS=y" .config
          grep -q "^CONFIG_IB=y" .config

      - name: Build toolchain
        run: |
          cd immortalwrt
          make -j"$(nproc)" tools/install
          make -j"$(nproc)" toolchain/install

      - name: Save toolchain cache
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            immortalwrt/staging_dir/host*
            immortalwrt/staging_dir/toolchain-*
            immortalwrt/build_dir/host*
            immortalwrt/build_dir/toolchain-*
          key: ${{ steps.cache-toolchain.outputs.cache-primary-key }}

      - name: Download sources
        run: cd immortalwrt && make -j"$(nproc)" download

      - name: Save download cache
        if: steps.cache-dl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: immortalwrt/dl
          key: dl-${{ env.BUILD_REF }}

      - name: Build
        run: cd immortalwrt && make -j"$(nproc)" world || make -j1 V=s world

      # Save even on a failed build so the retry is cheap.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: immortalwrt/.ccache
          key: ccache-${{ env.BUILD_REF }}-${{ github.run_id }}

      # CONFIG_BUILD_LOG=y writes per-package logs; without this a quiet
      # "-C toolchain/binutils ... failed to build" is undiagnosable.
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: immortalwrt/logs/
          if-no-files-found: ignore

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp immortalwrt/bin/targets/ramips/mt7620/*miwifi-r3* out/
          cp immortalwrt/bin/targets/ramips/mt7620/sha256sums out/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-xiaomi-miwifi-r3
          path: out/

      # ImageBuilder (CONFIG_IB): prebuilt kernel + every kmod (.apk) matching
      # this build's vermagic. Assembles new package sets / installs kmods for
      # THIS build without recompiling; big (hundreds of MB), so separate.
      - uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-imagebuilder-miwifi-r3
          path: immortalwrt/bin/targets/ramips/mt7620/immortalwrt-imagebuilder-*.tar.*
          if-no-files-found: error
